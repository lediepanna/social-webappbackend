
server.port=8080

# ===============================
# Database - PostgreSQL (Neon)
# ===============================
spring.datasource.url=jdbc:postgresql://ep-soft-unit-agk3tvpv.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_q5uakFKj2iWU
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true  

# ===============================
# Swagger bakom proxy (Koyeb)
# ===============================
server.forward-headers-strategy=framework
# JWT Configuration
# ===============================
jwt.secret=my-secret-key-needs-to-be-at-least-32-characters-long-1234567890
jwt.expiration=86400000
# Logging Configuration
logging.level.se.jensen.quyen.socialappbackend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Pattern for logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# Show request/response details
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Disable Hibernate banner
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Show binding parameters
spring.jpa.properties.hibernate.show_sql=true